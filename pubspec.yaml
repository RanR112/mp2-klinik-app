name: klinik_app
description: "Aplikasi Klinik - Mobile Programming II Pertemuan 2 s/d 13"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.6.0
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # .env dibaca lewat asset bundle oleh flutter_dotenv.
  assets:
    - .env
